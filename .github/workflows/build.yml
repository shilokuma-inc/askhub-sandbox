name: build

# PR と develop・main への push で、iOS の Simulator でビルドとテストを流す。
# AskHub のワーカーは、子 PR と最終 PR でこのジョブ（チェック名 build）を待つ
on:
  pull_request:
    # ドキュメントだけの変更では Build を実行しない（試しのために足した絞り）
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    paths-ignore: ['**/*.md']
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pick a simulator
        # 最新の iOS ランタイムにある iPhone を UDID で選ぶ（名前だけだと OS:latest を暗黙に要求して解決できないことがある）
        run: |
          simulator=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries | map(select(.key | contains("SimRuntime.iOS"))) | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj|tonumber),(.min|tonumber)]) | reverse | map(.value[] | select(.name | startswith("iPhone"))) | .[0]')
          echo "SIMULATOR_ID=$(jq -r .udid <<<"$simulator")" >> "$GITHUB_ENV"
          echo "simulator=$(jq -r '"\(.name) (\(.udid))"' <<<"$simulator")"

      - name: Build and test
        run: |
          xcodebuild test \
            -project SandboxApp.xcodeproj \
            -scheme SandboxApp \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
