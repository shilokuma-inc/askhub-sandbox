name: SandboxApp
options:
  bundleIdPrefix: jp.shilokuma
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SandboxApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/SandboxApp
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shilokuma.AskHubSandbox
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  SandboxAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SandboxAppTests
        type: syncedFolder
    dependencies:
      - target: SandboxApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.shilokuma.AskHubSandboxTests
schemes:
  SandboxApp:
    build:
      targets:
        SandboxApp: all
    test:
      targets:
        - SandboxAppTests
